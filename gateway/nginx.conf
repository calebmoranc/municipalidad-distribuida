# Los upstreams usan IP fijas, no nombres de contenedor. Con nombres, nginx los
# resuelve al arrancar y aborta si alguno no existe:
#
#     nginx: [emerg] host not found in upstream "tramites_1:3333"
#
# es decir, el gateway se negaba a arrancar si una replica estaba caida. Como las
# IP ya son fijas en docker-compose.yml, basta con ponerlas aqui: nginx arranca
# siempre y es max_fails quien decide en cada peticion a quien enrutar.
#
# Si cambias una IP en docker-compose.yml, hay que cambiarla tambien aqui.
upstream tramites_backend {
    server 172.28.0.13:3333 max_fails=1 fail_timeout=10s;
    server 172.28.0.14:3333 max_fails=1 fail_timeout=10s;
}
upstream usuarios_backend {
    server 172.28.0.11:3333 max_fails=1 fail_timeout=10s;
    server 172.28.0.12:3333 max_fails=1 fail_timeout=10s;
}
upstream pagos_backend {
    server 172.28.0.15:3333 max_fails=1 fail_timeout=10s;
    server 172.28.0.16:3333 max_fails=1 fail_timeout=10s;
}

# El log por defecto de nginx no dice a que replica respondio. Esto lo hace
# visible, que es lo que permite verificar el reparto y las caidas con curl.
# log_format solo es valido en contexto http, por eso va aqui y no en server.
log_format gateway '$remote_addr "$request" $status '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'upstream_time=$upstream_response_time total_time=$request_time';

# El read_timeout tiene que quedar por encima del peor caso de una llamada entre
# servicios: HTTP_TIMEOUT_MS x (HTTP_REINTENTOS + 1) + backoff, que con los
# valores por defecto de cliente_http.ts es 4.1s. Si el gateway se adelanta, agota
# su tiempo de espera, lo cuenta como fallo del upstream y con max_fails=1 expulsa
# a las dos replicas de golpe: dejaria de poder alcanzarlas.
server {
    listen 80;
    access_log /dev/stdout gateway;

    # Sonda de vida del propio gateway: responde sin tocar ninguna réplica.
    # Si esto responde 200, nginx está vivo aunque los tres servicios estén caídos.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Interfaz web. Son archivos estáticos: no tocan ninguna réplica, igual que
    # la sonda de vida. La raíz redirige para que no se pueda quedar fuera de /ui.
    location = / {
        return 302 /ui/;
    }
    location /ui/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ui/index.html;

        # Es una interfaz que se cambia durante la demostración: que el navegador
        # no conserve versiones viejas.
        add_header Cache-Control "no-store";
    }

    # Autenticación y cuenta. Sin esto, la interfaz no puede hacer login: el
    # servicio usuarios expone /api/v1/auth/* y /api/v1/account/*, pero el
    # gateway no los enrutaba.
    location /api/v1/auth {
        proxy_pass http://usuarios_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/account {
        proxy_pass http://usuarios_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Relojes logicos de Lamport. Cada replica tiene el suyo, asi que la ruta
    # indica a que servicio pertenece. El proxy_pass con URI reemplaza el
    # prefijo, de modo que el servicio solo expone /api/v1/reloj.
    location /api/v1/reloj/usuarios {
        proxy_pass http://usuarios_backend/api/v1/reloj;
        proxy_set_header Host $host;

        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/reloj/tramites {
        proxy_pass http://tramites_backend/api/v1/reloj;
        proxy_set_header Host $host;

        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/reloj/pagos {
        proxy_pass http://pagos_backend/api/v1/reloj;
        proxy_set_header Host $host;

        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Registro de intenciones de pago y reconciliador. Solo existe en pagos.
    location /api/v1/intentos {
        proxy_pass http://pagos_backend/api/v1/intentos;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;
    }

    # Estado de los interruptores de circuito. Solo existe en tramites y pagos,
    # porque usuarios no depende de nadie.
    location /api/v1/circuitos/tramites {
        proxy_pass http://tramites_backend/api/v1/circuitos;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;
    }
    location /api/v1/circuitos/pagos {
        proxy_pass http://pagos_backend/api/v1/circuitos;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;
    }

    location /tramites {
        proxy_pass http://tramites_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/tramites {
        # La identidad viaja firmada en X-Identidad; el token opaco de Adonis
        # solo lo entiende usuarios. Si se reenvia, pagos intenta validarlo
        # contra una tabla que no existe en su base y responde 500.
        proxy_set_header Authorization "";
        proxy_pass http://tramites_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    # Lista de identidades revocadas. La consultan trámites y pagos para
    # invalidar un X-Identidad antes de que caduque. No pasa por /auth para no
    # mezclarla con el login; sigue yendo al servicio usuarios.
    location /api/v1/identidades {
        proxy_pass http://usuarios_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/usuarios {
        proxy_pass http://usuarios_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    # Alta de usuarios desde administración. Debe ir antes (o ser más específica)
    # que /api/v1/usuarios; nginx elige el prefijo más largo.
    location /api/v1/admin/usuarios {
        proxy_pass http://usuarios_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    # Catálogo de tipos de trámite: vive en el servicio de trámites.
    location /api/v1/tipos-tramite {
        # Igual que /api/v1/tramites: la identidad va en X-Identidad.
        proxy_set_header Authorization "";
        proxy_pass http://tramites_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/pagos {
        # La identidad viaja firmada en X-Identidad; el token opaco de Adonis
        # solo lo entiende usuarios. Si se reenvia, pagos intenta validarlo
        # contra una tabla que no existe en su base y responde 500.
        proxy_set_header Authorization "";
        proxy_pass http://pagos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}