upstream tramites_backend {
    server tramites_1:3333 max_fails=1 fail_timeout=10s;
    server tramites_2:3333 max_fails=1 fail_timeout=10s;
}
upstream usuarios_backend {
    server usuarios_1:3333 max_fails=1 fail_timeout=10s;
    server usuarios_2:3333 max_fails=1 fail_timeout=10s;
}
upstream pagos_backend {
    server pagos_1:3333 max_fails=1 fail_timeout=10s;
    server pagos_2:3333 max_fails=1 fail_timeout=10s;
}

# El log por defecto de nginx no dice a que replica respondio. Esto lo hace
# visible, que es lo que permite verificar el reparto y las caidas con curl.
# log_format solo es valido en contexto http, por eso va aqui y no en server.
log_format gateway '$remote_addr "$request" $status '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'upstream_time=$upstream_response_time total_time=$request_time';

server {
    listen 80;
    access_log /dev/stdout gateway;

    # Sonda de vida del propio gateway: responde sin tocar ninguna réplica.
    # Si esto responde 200, nginx está vivo aunque los tres servicios estén caídos.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /tramites {
        proxy_pass http://tramites_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/tramites {
        proxy_pass http://tramites_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/usuarios {
        proxy_pass http://usuarios_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location /api/v1/pagos {
        proxy_pass http://pagos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}