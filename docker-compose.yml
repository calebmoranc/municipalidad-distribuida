services:

  postgres: #tercer proceso, centraliza los datos
  
    image: postgres:16-alpine
    container_name: municipalidad_postgres
    environment:
      POSTGRES_DB: municipalidad
      POSTGRES_USER: municipalidad
      POSTGRES_PASSWORD: municipalidad_dev
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: #las réplicas esperan que PostgreSQL esté listo antes de iniciar.
      test: ["CMD-SHELL", "pg_isready -U municipalidad -d municipalidad"]
      interval: 5s
      timeout: 5s
      retries: 10

  tramites_1:
    build: ./tramites
    env_file:
      - ./tramites/.env
    container_name: tramites_1
    ports:
      - "3333:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: municipalidad
    depends_on:
      postgres:
        condition: service_healthy

  tramites_2:
    build: ./tramites
    env_file:
      - ./tramites/.env
    container_name: tramites_2
    ports:
      - "3334:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: municipalidad
    depends_on: #las réplicas esperan que PostgreSQL esté listo antes de iniciar.
      postgres:
        condition: service_healthy
  gateway:
    image: nginx:alpine
    container_name: municipalidad_gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tramites_1:
        condition: service_started
      tramites_2:
        condition: service_started
  usuarios_1:
    build: ./usuarios
    container_name: usuarios_1
    env_file:
      - ./usuarios/.env
    ports:
      - "3335:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: usuarios_db
    depends_on:
      postgres:
        condition: service_healthy

  usuarios_2:
    build: ./usuarios
    container_name: usuarios_2
    env_file:
      - ./usuarios/.env
    ports:
      - "3336:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: usuarios_db
    depends_on:
      postgres:
        condition: service_healthy
  pagos_1:
    build: ./pagos
    container_name: pagos_1
    env_file:
      - ./pagos/.env
    ports:
      - "3337:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: pagos_db
    depends_on:
      postgres:
        condition: service_healthy
  pagos_2:
    build: ./pagos
    container_name: pagos_2
    env_file:
      - ./pagos/.env
    ports:
      - "3338:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: pagos_db
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: #volumen persistente: los datos sobreviven a los reinicios de los contenedores