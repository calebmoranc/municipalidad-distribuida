services:

  postgres: #tercer proceso, centraliza los datos

    image: postgres:16-alpine
    container_name: municipalidad_postgres
    environment:
      POSTGRES_DB: municipalidad
      POSTGRES_USER: municipalidad
      POSTGRES_PASSWORD: municipalidad_dev

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: #las réplicas esperan que PostgreSQL esté listo antes de iniciar.
      test: ["CMD-SHELL", "pg_isready -U municipalidad -d municipalidad"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      municipalidad:
        ipv4_address: 172.28.0.10

  # --- Servicios de un solo uso: crean bases y aplican migraciones -----------
  # Son un contenedor por servicio para evitar que las dos réplicas apliquen
  # migraciones al mismo tiempo sobre la misma base.

  db_init:
    image: postgres:16-alpine
    container_name: municipalidad_db_init
    entrypoint: ["/bin/sh", "/scripts/init-databases.sh"]
    environment:
      PGHOST: postgres
      PGUSER: municipalidad
      PGPASSWORD: municipalidad_dev
      PGDATABASE: municipalidad
    volumes:
      - ./postgres/init-databases.sh:/scripts/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - municipalidad

  tramites_migrate:
    image: municipalidad/tramites:local
    build: ./tramites
    env_file:
      - ./tramites/.env
    command: ["node", "ace", "migration:run", "--force"]
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: municipalidad
      USUARIOS_SERVICE_URL: http://gateway
    depends_on:
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - municipalidad

  usuarios_migrate:
    image: municipalidad/usuarios:local
    build: ./usuarios
    env_file:
      - ./usuarios/.env
    command: ["node", "ace", "migration:run", "--force"]
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: usuarios_db
    depends_on:
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - municipalidad

  pagos_migrate:
    image: municipalidad/pagos:local
    build: ./pagos
    env_file:
      - ./pagos/.env
    command: ["node", "ace", "migration:run", "--force"]
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: pagos_db
      USUARIOS_SERVICE_URL: http://gateway
    depends_on:
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - municipalidad

  # --- Réplicas ---------------------------------------------------------------
  # Todas con IP fija. Nginx resuelve los nombres de los upstreams UNA sola vez
  # al arrancar, así que si las IP cambiaran al recrear un contenedor, nginx
  # seguiría hablando con la IP vieja (que ya pertenece a otro servicio).
  # Las IP fijas hacen que la topología sea siempre la misma.

  tramites_1:
    image: municipalidad/tramites:local
    build: ./tramites
    env_file:
      - ./tramites/.env
    container_name: tramites_1
    ports:
      - "3333:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: municipalidad
      USUARIOS_SERVICE_URL: http://gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      tramites_migrate:
        condition: service_completed_successfully
    networks:
      municipalidad:
        ipv4_address: 172.28.0.13

  tramites_2:
    image: municipalidad/tramites:local
    build: ./tramites
    env_file:
      - ./tramites/.env
    container_name: tramites_2
    ports:
      - "3334:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: municipalidad
      USUARIOS_SERVICE_URL: http://gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on: #las réplicas esperan que PostgreSQL esté listo antes de iniciar.
      postgres:
        condition: service_healthy
      tramites_migrate:
        condition: service_completed_successfully
    networks:
      municipalidad:
        ipv4_address: 172.28.0.14

  usuarios_1:
    image: municipalidad/usuarios:local
    build: ./usuarios
    container_name: usuarios_1
    env_file:
      - ./usuarios/.env
    ports:
      - "3335:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: usuarios_db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      usuarios_migrate:
        condition: service_completed_successfully
    networks:
      municipalidad:
        ipv4_address: 172.28.0.11

  usuarios_2:
    image: municipalidad/usuarios:local
    build: ./usuarios
    container_name: usuarios_2
    env_file:
      - ./usuarios/.env
    ports:
      - "3336:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: usuarios_db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      usuarios_migrate:
        condition: service_completed_successfully
    networks:
      municipalidad:
        ipv4_address: 172.28.0.12

  pagos_1:
    image: municipalidad/pagos:local
    build: ./pagos
    container_name: pagos_1
    env_file:
      - ./pagos/.env
    ports:
      - "3337:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: pagos_db
      USUARIOS_SERVICE_URL: http://gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      pagos_migrate:
        condition: service_completed_successfully
    networks:
      municipalidad:
        ipv4_address: 172.28.0.15

  pagos_2:
    image: municipalidad/pagos:local
    build: ./pagos
    container_name: pagos_2
    env_file:
      - ./pagos/.env
    ports:
      - "3338:3333"
    environment:
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: municipalidad
      DB_PASSWORD: municipalidad_dev
      DB_DATABASE: pagos_db
      USUARIOS_SERVICE_URL: http://gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      pagos_migrate:
        condition: service_completed_successfully
    networks:
      municipalidad:
        ipv4_address: 172.28.0.16

  gateway:
    image: nginx:alpine
    container_name: municipalidad_gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tramites_1:
        condition: service_healthy
      tramites_2:
        condition: service_healthy
      usuarios_1:
        condition: service_healthy
      usuarios_2:
        condition: service_healthy
      pagos_1:
        condition: service_healthy
      pagos_2:
        condition: service_healthy
    networks:
      municipalidad:
        ipv4_address: 172.28.0.20

networks:
  municipalidad:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data: #volumen persistente: los datos sobreviven a los reinicios de los contenedores